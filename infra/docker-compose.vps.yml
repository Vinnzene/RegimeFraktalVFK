# Deploy ke VPS tanpa domain: semua diakses lewat http://<IP-VPS> (port 80).
# Caddy meneruskan /api/v1/* ke FastAPI dan sisanya ke Next.js, sehingga
# browser hanya berbicara dengan satu alamat (tidak ada port 8000 yang dibuka).
#
#   docker compose -f infra/docker-compose.vps.yml up -d --build
#
# Panduan lengkap: docs/DEPLOY_VPS.md

# Nama project tetap, agar tidak bentrok dengan compose lama di infra/docker-compose.yml.
name: regimefraktal

services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost}
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../data:/app/data
      - ../ml/artifacts:/app/ml/artifacts:ro
      - ../secrets:/app/secrets:ro
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE=same-origin
    restart: unless-stopped
    env_file: ../frontend/.env.local
    environment:
      - NODE_ENV=production
      - FIREBASE_SERVICE_ACCOUNT=/app/secrets/firebase-service-account.json
      # Rute /api/analyses memanggil endpoint internal backend lewat jaringan Docker.
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Tanpa HTTPS browser menolak cookie Secure; ubah ke true bila sudah memakai domain + HTTPS.
      - COOKIE_SECURE=true
    volumes:
      - ../secrets:/app/secrets:ro
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
